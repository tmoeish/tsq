# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - id: default
    main: ./cmd/tsq
    env:
      - CGO_ENABLED=0
    # -trimpath keeps the released binary from embedding the CI machine's absolute
    # paths, matching what `make build` already does locally.
    flags:
      - -trimpath
    # The -X targets must name the package that actually declares the variables.
    # The linker silently ignores an -X for a symbol it cannot find, so a wrong
    # import path here fails invisibly: it produced binaries reporting "unknown"
    # for build time, commit and branch, with no build error anywhere.
    # Use .Tag, not .Version: .Version strips the leading "v", and every other
    # copy of this version string ("v4.4.2" in internal/buildinfo, the CHANGELOG
    # heading, the generated file headers) carries it.
    ldflags:
      - -s -w
      - -X github.com/tmoeish/tsq/v4/internal/buildinfo.version={{ .Tag }}
      - -X github.com/tmoeish/tsq/v4/internal/buildinfo.buildTime={{ .Date }}
      - -X github.com/tmoeish/tsq/v4/internal/buildinfo.gitCommit={{ .Commit }}
      - -X github.com/tmoeish/tsq/v4/internal/buildinfo.gitBranch={{ .Branch }}
    goos:
      - linux
      - windows
      - darwin

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
