# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.27.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Makefile smoke test
      run: make -n all

    - name: Run tests
      run: make test

    # Same flags as the local harness (-race -shuffle=on -count=1): shuffling is
    # what surfaces order-dependent tests, so CI must not run a weaker variant.
    - name: Run tests with race detector
      run: make test-race

  # Real MySQL and PostgreSQL. The unit suite only ever touches SQLite, so this job
  # is the only automated coverage of dialect/mysql.go and dialect/postgres.go.
  # Not a ruleset-required check yet; promote it once it has run green for a while.
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tsq
          MYSQL_DATABASE: tsq
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptsq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tsq
          POSTGRES_PASSWORD: tsq
          POSTGRES_DB: tsq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TSQ_MYSQL_DSN: "root:tsq@tcp(127.0.0.1:3306)/tsq?parseTime=true&multiStatements=true"
      TSQ_POSTGRES_DSN: "postgres://tsq:tsq@127.0.0.1:5432/tsq?sslmode=disable"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run integration tests
      run: go test -race -count=1 -run 'Integration' ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    # `make lint` pins the golangci-lint version in the Makefile. Running the action
    # with `version: latest` here made CI and the local harness two different truths.
    - name: golangci-lint
      run: make lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run coverage
      run: make test-coverage

    # `tsq gen --check` re-renders from the current sources and compares; that is the
    # authoritative "generated files are in sync" criterion, not `git diff`.
    - name: Ensure generated examples are in sync
      run: make gen-check

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: ~/go/bin/gosec -no-fail -fmt sarif -out results.sarif ./...

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: ~/go/bin/govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tsq-binary
        path: bin/tsq

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build Docker image
      run: >-
        docker build
        --build-arg VERSION=ci-${{ github.sha }}
        --build-arg GIT_COMMIT=${{ github.sha }}
        --build-arg BUILD_TIME=ci
        -t tsq:ci .

    # `make release-check` proves the -X targets name real symbols; this proves the
    # values actually reach the binary inside the image. A wrong ldflag is silent at
    # build time, so running the artifact is the only check that cannot lie.
    - name: Verify build metadata reaches the image binary
      run: |
        docker run --rm tsq:ci version --json | tee version.json
        grep -q '"git_commit": "${{ github.sha }}"' version.json
        grep -q '"version": "ci-${{ github.sha }}"' version.json

  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install GoReleaser
      run: go install github.com/goreleaser/goreleaser/v2@latest

    - name: Check GoReleaser config
      run: ~/go/bin/goreleaser check

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, coverage, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
